*{margin:0;padding:0;box-sizing:border-box}

footer{padding:1.5rem;text-align:center;border-top:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-secondary);font-size:.85rem}

<script>
const T={"en": ["Support the {UPL} project", "Theme", "I build fictional worlds, websites and stories as a creative project. If you enjoy them, you can leave a small, voluntary tip. It is never expected, and everything stays free to enjoy either way.", "Helps fund hosting, tools and time for new fictional works.", "Completely optional – everything stays free.", "A tip, not a purchase: no goods, services, access or influence.", "Before you continue", "Everything on these websites is fiction. To support me you must confirm that you understand this and that nothing is provided in return.", "Continue to confirmation →", "Please confirm", "Read the terms and tick both boxes to continue.", "Fiction. All websites, stories, characters, organisations, places, events, documents and services created by the site owner (the “Works”) are entirely fictional. Any resemblance to real persons, organisations, governments or events is coincidental. The Works are not real or official, are not affiliated with any real body, and are not professional, legal, medical, financial or emergency advice.", "Voluntary gift. Any payment is a voluntary gift to support creative work and, to the extent permitted by law, is non-refundable. It is not a purchase, subscription, charitable donation or investment, and you will not receive merchandise, services, memberships, in-world titles, early access, credit, influence or any other benefit. No contract or ongoing obligation arises.", "Third party. Payments are handled solely by Buy Me a Coffee and its payment partners under their own terms and privacy policy. The site owner does not receive or store your payment details.", "Capacity and language. You are old enough to agree under the law where you live, or you have a parent’s or guardian’s permission. Translations are for convenience, may be inaccurate, and the English version prevails.", "I understand that all of these websites and stories are fictional and unreal.", "I understand that my gift is voluntary and non-refundable, that I will not receive any merchandise, services or other benefits, and I agree to the terms above.", "I agree – show the support button", "Thank you!", "Click below to go to Buy Me a Coffee.", "← Back", "Contrast", "Grayscale", "Saturate", "Crosshair colour", "Enable crosshair assist", "Reset", "Select language", "Close", "© 2026 Support the UPL project · All websites, stories, characters and organisations are works of fiction."], "zh-Hans": ["支持 {UPL} 项目", "主题", "我以创作为乐，打造虚构的世界、网站与故事。如果您喜欢，可以自愿打赏一点心意。这绝非必须，无论是否打赏，所有内容都可免费欣赏。", "用于支付新虚构作品的托管、工具与创作时间。", "完全自愿——所有内容始终免费。", "是打赏而非购买：不含任何商品、服务、特权或影响力。", "继续之前", "本站所有内容均为虚构。若要支持我，您须确认理解这一点，且不会获得任何回报。", "继续前往确认 →", "请确认", "请阅读条款并勾选两个选框以继续。", "虚构。站点所有者创作的所有网站、故事、人物、组织、地点、事件、文件和服务（“作品”）均纯属虚构。如与真实的人物、组织、政府或事件雷同，纯属巧合。作品并非真实或官方，与任何真实机构无关，亦不构成专业、法律、医疗、财务或紧急事务建议。", "自愿赠与。任何付款均为支持创作的自愿赠与，在法律允许的范围内不可退还。这不是购买、订阅、慈善捐赠或投资，您不会获得任何周边商品、服务、会员资格、虚构世界中的头衔、抢先体验、署名、影响力或其他任何回报，亦不产生合同或持续性义务。", "第三方。付款完全由 Buy Me a Coffee 及其支付合作伙伴按其自身条款和隐私政策处理。站点所有者不会接收或保存您的支付信息。", "资格与语言。您已达到所在地法律规定的同意年龄，或已获得家长或监护人许可。翻译仅为方便而提供，可能不准确，以英文版本为准。", "我理解所有这些网站和故事均为虚构，并非真实。", "我理解我的赠与是自愿且不可退还的，我不会获得任何周边商品、服务或其他回报，并同意上述条款。", "我同意——显示支持按钮", "谢谢您！", "请点击下方前往 Buy Me a Coffee。", "← 返回", "对比度", "灰度", "饱和度", "准星颜色", "启用准星辅助", "重置", "选择语言", "关闭", "© 2026 支持 UPL 项目 · 所有网站、故事、人物和组织均为虚构作品。"], "lzh": ["助{UPL}之業", "主題", "吾作虛構之世、之網、之傳，以爲志業。君若悅之，可隨意贈微禮。此非必也，君不贈亦可共賞。", "所助者，乃新作之託管、器用與時日。", "全憑己意，諸作恆可免費觀之。", "乃饋贈，非購買；無貨、無役、無特權、無權柄。", "未進之前", "此網所載，皆屬虛構。君欲助之，須確知此事，且明無所回報。", "往確認焉 →", "請確認", "覽條款畢，勾二框以進。", "虛構。網主所作諸網、傳記、人物、機構、地方、事件、文書與服務（謂之“作品”），皆爲虛構。若與真實人物、機構、政府或事件相類，實屬偶合。作品非真、非官，與真實之任何機構無涉，亦非專業、法律、醫藥、財務或急難之諫言。", "自願饋贈。凡所付者，皆爲助創作之自願饋贈，法所許者，不得退還。此非購買、訂閱、慈善之捐或投資；君不得貨物、服務、會籍、界中名位、先睹、署名、權柄，或他回報；亦不生契約及恆久之責。", "第三方。付款悉由 Buy Me a Coffee 及其合作者依其條款與隱私政策辦理。網主不收不存君之付款資料。", "資格與語言。君已及所居地法律所定可許之齡，或得父母監護者之允。譯文以便覽而設，或有不確，當以英文本爲準。", "我知此諸網與傳記皆爲虛構，非真實也。", "我知所贈出於自願，不得退還，亦不得貨物、服務或他回報；並同意上列條款。", "我同意——示助力之鈕", "多謝！", "請點下方，往 Buy Me a Coffee。", "← 返", "對比", "灰度", "飽和", "準星色", "啓準星輔", "復原", "擇語", "閉", "© 2026 助 UPL 之業 · 諸網、傳記、人物、機構，皆屬虛構。"], "es": ["Apoya el proyecto {UPL}", "Tema", "Creo mundos, sitios web e historias ficticios como proyecto creativo. Si te gustan, puedes dejar una pequeña propina voluntaria. Nunca es obligatoria y todo sigue siendo gratuito.", "Ayuda a costear alojamiento, herramientas y tiempo para nuevas obras ficticias.", "Totalmente opcional: todo sigue siendo gratis.", "Una propina, no una compra: sin bienes, servicios, acceso ni influencia.", "Antes de continuar", "Todo en estos sitios es ficción. Para apoyarme debes confirmar que lo entiendes y que no recibirás nada a cambio.", "Continuar a la confirmación →", "Por favor, confirma", "Lee los términos y marca ambas casillas para continuar.", "Ficción. Todos los sitios web, historias, personajes, organizaciones, lugares, hechos, documentos y servicios creados por el titular del sitio (las «Obras») son totalmente ficticios. Cualquier parecido con personas, organizaciones, gobiernos o hechos reales es coincidencia. Las Obras no son reales ni oficiales, no están afiliadas a ningún organismo real y no constituyen asesoramiento profesional, jurídico, médico, financiero ni de emergencia.", "Regalo voluntario. Todo pago es un regalo voluntario para apoyar el trabajo creativo y, en la medida que la ley lo permita, no es reembolsable. No es una compra, suscripción, donación benéfica ni inversión, y no recibirás mercancía, servicios, membresías, títulos dentro de la ficción, acceso anticipado, créditos, influencia ni ningún otro beneficio. No surge ningún contrato ni obligación continuada.", "Terceros. Los pagos los gestionan exclusivamente Buy Me a Coffee y sus socios de pago según sus propios términos y política de privacidad. El titular del sitio no recibe ni almacena tus datos de pago.", "Capacidad e idioma. Tienes edad suficiente para aceptar según la ley de tu país o cuentas con permiso de tus padres o tutores. Las traducciones son orientativas y pueden ser inexactas; prevalece la versión en inglés.", "Entiendo que todos estos sitios web e historias son ficticios e irreales.", "Entiendo que mi regalo es voluntario y no reembolsable, que no recibiré mercancía, servicios ni otros beneficios, y acepto los términos anteriores.", "Acepto: mostrar el botón de apoyo", "¡Gracias!", "Haz clic abajo para ir a Buy Me a Coffee.", "← Volver", "Contraste", "Escala de grises", "Saturación", "Color de la mira", "Activar asistencia de mira", "Restablecer", "Seleccionar idioma", "Cerrar", "© 2026 Apoya el proyecto UPL · Todos los sitios web, historias, personajes y organizaciones son obras de ficción."], "de": ["Unterstütze das {UPL}-Projekt", "Design", "Ich erschaffe fiktive Welten, Websites und Geschichten als kreatives Projekt. Wenn sie dir gefallen, kannst du ein kleines, freiwilliges Trinkgeld geben. Das wird nie erwartet; alles bleibt kostenlos.", "Hilft bei Hosting, Werkzeugen und Zeit für neue fiktive Werke.", "Völlig freiwillig – alles bleibt kostenlos.", "Ein Trinkgeld, kein Kauf: keine Waren, Dienste, Zugänge oder Einflussnahme.", "Bevor du fortfährst", "Alles auf diesen Websites ist Fiktion. Um mich zu unterstützen, musst du bestätigen, dass du das verstehst und nichts dafür erhältst.", "Weiter zur Bestätigung →", "Bitte bestätigen", "Lies die Bedingungen und setze beide Häkchen, um fortzufahren.", "Fiktion. Alle vom Websitebetreiber geschaffenen Websites, Geschichten, Figuren, Organisationen, Orte, Ereignisse, Dokumente und Dienste (die „Werke“) sind vollständig fiktiv. Ähnlichkeiten mit realen Personen, Organisationen, Regierungen oder Ereignissen sind zufällig. Die Werke sind weder real noch offiziell, stehen in keiner Verbindung zu realen Stellen und stellen keine fachliche, rechtliche, medizinische, finanzielle oder Notfallberatung dar.", "Freiwillige Schenkung. Jede Zahlung ist eine freiwillige Schenkung zur Förderung kreativer Arbeit und, soweit gesetzlich zulässig, nicht erstattungsfähig. Sie ist kein Kauf, Abonnement, keine gemeinnützige Spende und keine Investition; du erhältst keine Waren, Dienste, Mitgliedschaften, Titel in der fiktiven Welt, frühen Zugang, Namensnennung, Einfluss oder sonstige Vorteile. Es entsteht kein Vertrag und keine fortlaufende Verpflichtung.", "Dritte. Zahlungen werden ausschließlich von Buy Me a Coffee und dessen Zahlungspartnern nach deren eigenen Bedingungen und Datenschutzrichtlinien abgewickelt. Der Websitebetreiber erhält und speichert deine Zahlungsdaten nicht.", "Geschäftsfähigkeit und Sprache. Du bist nach dem an deinem Wohnort geltenden Recht alt genug zuzustimmen oder hast die Erlaubnis eines Elternteils bzw. Vormunds. Übersetzungen dienen nur der Orientierung und können ungenau sein; maßgeblich ist die englische Fassung.", "Ich verstehe, dass alle diese Websites und Geschichten fiktiv und unwirklich sind.", "Ich verstehe, dass meine Zuwendung freiwillig und nicht erstattungsfähig ist, ich keine Waren, Dienste oder sonstigen Vorteile erhalte, und stimme den obigen Bedingungen zu.", "Ich stimme zu – Unterstützungs-Button anzeigen", "Danke!", "Klicke unten, um zu Buy Me a Coffee zu gelangen.", "← Zurück", "Kontrast", "Graustufen", "Sättigung", "Fadenkreuzfarbe", "Fadenkreuz-Assistent aktivieren", "Zurücksetzen", "Sprache auswählen", "Schließen", "© 2026 Unterstütze das UPL-Projekt · Alle Websites, Geschichten, Figuren und Organisationen sind fiktive Werke."], "pt": ["Apoie o projeto {UPL}", "Tema", "Crio mundos, sites e histórias fictícios como projeto criativo. Se gostar, pode deixar uma pequena gorjeta voluntária. Nunca é esperada e tudo continua gratuito.", "Ajuda a custear alojamento, ferramentas e tempo para novas obras fictícias.", "Totalmente opcional: tudo continua gratuito.", "Uma gorjeta, não uma compra: sem bens, serviços, acesso ou influência.", "Antes de continuar", "Tudo nestes sites é ficção. Para me apoiar, tem de confirmar que o compreende e que não receberá nada em troca.", "Continuar para a confirmação →", "Confirme, por favor", "Leia os termos e marque as duas caixas para continuar.", "Ficção. Todos os sites, histórias, personagens, organizações, locais, acontecimentos, documentos e serviços criados pelo titular do site (as «Obras») são inteiramente fictícios. Qualquer semelhança com pessoas, organizações, governos ou acontecimentos reais é coincidência. As Obras não são reais nem oficiais, não têm ligação a qualquer entidade real e não constituem aconselhamento profissional, jurídico, médico, financeiro ou de emergência.", "Oferta voluntária. Qualquer pagamento é uma oferta voluntária para apoiar o trabalho criativo e, na medida permitida por lei, não é reembolsável. Não é compra, subscrição, donativo de caridade nem investimento, e não receberá produtos, serviços, adesões, títulos no mundo fictício, acesso antecipado, créditos, influência ou outros benefícios. Não surge qualquer contrato nem obrigação contínua.", "Terceiros. Os pagamentos são tratados exclusivamente pelo Buy Me a Coffee e pelos seus parceiros de pagamento, segundo os seus próprios termos e política de privacidade. O titular do site não recebe nem guarda os seus dados de pagamento.", "Capacidade e idioma. Tem idade suficiente para aceitar segundo a lei do seu país ou tem autorização de um pai ou tutor. As traduções são meramente indicativas e podem ser inexatas; prevalece a versão em inglês.", "Compreendo que todos estes sites e histórias são fictícios e irreais.", "Compreendo que a minha oferta é voluntária e não reembolsável, que não receberei produtos, serviços ou outros benefícios, e aceito os termos acima.", "Aceito – mostrar o botão de apoio", "Obrigado!", "Clique abaixo para ir ao Buy Me a Coffee.", "← Voltar", "Contraste", "Escala de cinzentos", "Saturação", "Cor da mira", "Ativar assistência de mira", "Repor", "Selecionar idioma", "Fechar", "© 2026 Apoie o projeto UPL · Todos os sites, histórias, personagens e organizações são obras de ficção."], "fr": ["Soutenez le projet {UPL}", "Thème", "Je crée des mondes, sites web et histoires fictifs comme projet créatif. Si vous les appréciez, vous pouvez laisser un petit pourboire volontaire. Il n'est jamais attendu et tout reste gratuit.", "Aide à financer l'hébergement, les outils et le temps pour de nouvelles œuvres fictives.", "Entièrement facultatif : tout reste gratuit.", "Un pourboire, pas un achat : ni biens, ni services, ni accès, ni influence.", "Avant de continuer", "Tout sur ces sites est fictif. Pour me soutenir, vous devez confirmer que vous le comprenez et que vous ne recevrez rien en échange.", "Continuer vers la confirmation →", "Veuillez confirmer", "Lisez les conditions et cochez les deux cases pour continuer.", "Fiction. Tous les sites web, histoires, personnages, organisations, lieux, événements, documents et services créés par le propriétaire du site (les « Œuvres ») sont entièrement fictifs. Toute ressemblance avec des personnes, organisations, gouvernements ou événements réels est fortuite. Les Œuvres ne sont ni réelles ni officielles, ne sont affiliées à aucun organisme réel et ne constituent pas un conseil professionnel, juridique, médical, financier ou d'urgence.", "Don volontaire. Tout paiement est un don volontaire destiné à soutenir le travail créatif et, dans la mesure permise par la loi, n'est pas remboursable. Ce n'est ni un achat, ni un abonnement, ni un don caritatif, ni un investissement, et vous ne recevrez ni marchandises, ni services, ni adhésions, ni titres dans l'univers fictif, ni accès anticipé, ni crédit, ni influence, ni aucun autre avantage. Aucun contrat ni obligation continue n'en résulte.", "Tiers. Les paiements sont traités exclusivement par Buy Me a Coffee et ses partenaires de paiement selon leurs propres conditions et politique de confidentialité. Le propriétaire du site ne reçoit ni ne conserve vos données de paiement.", "Capacité et langue. Vous avez l'âge requis pour accepter selon la loi de votre pays ou l'autorisation d'un parent ou tuteur. Les traductions sont fournies à titre indicatif et peuvent être inexactes ; la version anglaise prévaut.", "Je comprends que tous ces sites web et histoires sont fictifs et irréels.", "Je comprends que mon don est volontaire et non remboursable, que je ne recevrai ni marchandises, ni services, ni autres avantages, et j'accepte les conditions ci-dessus.", "J'accepte – afficher le bouton de soutien", "Merci !", "Cliquez ci-dessous pour accéder à Buy Me a Coffee.", "← Retour", "Contraste", "Niveaux de gris", "Saturation", "Couleur du viseur", "Activer l'assistance viseur", "Réinitialiser", "Choisir la langue", "Fermer", "© 2026 Soutenez le projet UPL · Tous les sites web, histoires, personnages et organisations sont des œuvres de fiction."], "ru": ["Поддержите проект {UPL}", "Тема", "Я создаю вымышленные миры, сайты и истории как творческий проект. Если они вам нравятся, можете оставить небольшие добровольные чаевые. Это никогда не требуется, всё остаётся бесплатным.", "Помогает оплачивать хостинг, инструменты и время для новых вымышленных работ.", "Полностью добровольно: всё остаётся бесплатным.", "Чаевые, а не покупка: без товаров, услуг, доступа и влияния.", "Прежде чем продолжить", "Всё на этих сайтах — вымысел. Чтобы поддержать меня, подтвердите, что вы это понимаете и ничего не получите взамен.", "Перейти к подтверждению →", "Пожалуйста, подтвердите", "Прочитайте условия и отметьте оба пункта, чтобы продолжить.", "Вымысел. Все сайты, истории, персонажи, организации, места, события, документы и услуги, созданные владельцем сайта («Работы»), полностью вымышлены. Любое сходство с реальными людьми, организациями, правительствами или событиями случайно. Работы не являются реальными или официальными, не связаны с какими-либо реальными органами и не являются профессиональной, юридической, медицинской, финансовой или экстренной консультацией.", "Добровольный дар. Любой платёж — добровольный дар в поддержку творчества и в пределах, допускаемых законом, возврату не подлежит. Это не покупка, не подписка, не благотворительное пожертвование и не инвестиция; вы не получите товаров, услуг, членства, титулов в вымышленном мире, раннего доступа, упоминания, влияния или иных выгод. Никакого договора или длящегося обязательства не возникает.", "Третьи лица. Платежи обрабатываются исключительно Buy Me a Coffee и его платёжными партнёрами по их собственным условиям и политике конфиденциальности. Владелец сайта не получает и не хранит ваши платёжные данные.", "Дееспособность и язык. Вы достигли возраста, достаточного для согласия по законам вашей страны, либо имеете разрешение родителя или опекуна. Переводы приводятся для удобства и могут быть неточными; приоритет имеет английская версия.", "Я понимаю, что все эти сайты и истории вымышлены и нереальны.", "Я понимаю, что мой дар добровольный и возврату не подлежит, что я не получу товаров, услуг или иных выгод, и принимаю условия выше.", "Согласен — показать кнопку поддержки", "Спасибо!", "Нажмите ниже, чтобы перейти на Buy Me a Coffee.", "← Назад", "Контраст", "Оттенки серого", "Насыщенность", "Цвет прицела", "Включить помощь прицела", "Сброс", "Выберите язык", "Закрыть", "© 2026 Поддержите проект UPL · Все сайты, истории, персонажи и организации — вымысел."], "mn": ["{UPL} төслийг дэмжээрэй", "Загвар", "Би зохиомол ертөнц, вэбсайт, түүхүүдийг бүтээлч төсөл болгон бүтээдэг. Танд таалагдвал сайн дураараа жижиг шагнал үлдээж болно. Үүнийг хэзээ ч шаарддаггүй бөгөөд бүх зүйл үнэгүй хэвээр байна.", "Шинэ зохиомол бүтээлийн хостинг, хэрэгсэл, цагийг санхүүжүүлнэ.", "Бүрэн сайн дурын: бүх зүйл үнэгүй хэвээр.", "Худалдан авалт биш шагнал: бараа, үйлчилгээ, хандалт, нөлөө байхгүй.", "Үргэлжлүүлэхийн өмнө", "Эдгээр сайтууд дээрх бүх зүйл зохиомол. Намайг дэмжихийн тулд та үүнийг ойлгосноо, мөн хариуд нь юу ч авахгүйгээ баталгаажуулах ёстой.", "Баталгаажуулалт руу үргэлжлүүлэх →", "Баталгаажуулна уу", "Нөхцөлийг уншаад хоёр нүдийг тэмдэглэж үргэлжлүүлнэ үү.", "Зохиомол. Сайтын эзний бүтээсэн бүх вэбсайт, түүх, дүр, байгууллага, газар, үйл явдал, баримт бичиг, үйлчилгээ («Бүтээлүүд») бүгд бүрэн зохиомол. Бодит хүн, байгууллага, засгийн газар, үйл явдалтай төстэй байвал санамсаргүй давхцал юм. Бүтээлүүд бодит буюу албан ёсных биш, ямар ч бодит байгууллагатай холбоогүй бөгөөд мэргэжлийн, хууль зүйн, эмнэлгийн, санхүүгийн болон яаралтай зөвлөгөө биш.", "Сайн дурын бэлэг. Аливаа төлбөр нь бүтээлч ажлыг дэмжих сайн дурын бэлэг бөгөөд хуулиар зөвшөөрөгдсөн хэмжээнд буцаан олгохгүй. Энэ нь худалдан авалт, захиалга, буяны хандив, хөрөнгө оруулалт биш; та бараа, үйлчилгээ, гишүүнчлэл, зохиомол ертөнцийн цол, эрт хандалт, нэр дурдалт, нөлөө болон өөр ямар ч ашиг тус авахгүй. Гэрээ эсвэл үргэлжлэх үүрэг үүсэхгүй.", "Гуравдагч тал. Төлбөрийг зөвхөн Buy Me a Coffee болон түүний төлбөрийн түншүүд өөрсдийн нөхцөл, нууцлалын бодлогын дагуу боловсруулна. Сайтын эзэн таны төлбөрийн мэдээллийг хүлээн авахгүй, хадгалахгүй.", "Эрх зүйн чадамж ба хэл. Та оршин суугаа газрынхаа хуулиар зөвшөөрөх насанд хүрсэн эсвэл эцэг эх, асран хамгаалагчийн зөвшөөрөлтэй. Орчуулга нь зөвхөн тохиромжтой байхын тулд бөгөөд буруу байж болно; Англи хувилбар давамгайлна.", "Эдгээр бүх вэбсайт, түүхүүд зохиомол, бодит бус гэдгийг ойлгосон.", "Миний бэлэг сайн дурын, буцаагдахгүй бөгөөд би ямар ч бараа, үйлчилгээ, бусад ашиг тус авахгүй гэдгийг ойлгосон бөгөөд дээрх нөхцөлийг зөвшөөрч байна.", "Зөвшөөрч байна – дэмжих товчийг харуулах", "Баярлалаа!", "Buy Me a Coffee руу очихын тулд доор дарна уу.", "← Буцах", "Ялгарал", "Саарал өнгө", "Ханалт", "Харагчийн өнгө", "Харагчийн тусламжийг идэвхжүүлэх", "Дахин тохируулах", "Хэл сонгох", "Хаах", "© 2026 UPL төслийг дэмжээрэй · Бүх вэбсайт, түүх, дүр, байгууллага нь зохиомол бүтээл юм."], "ja": ["{UPL}プロジェクトを応援", "テーマ", "創作活動として、架空の世界やウェブサイト、物語を作っています。気に入っていただけたら、任意で少額のチップをいただけます。決して必須ではなく、すべて無料でお楽しみいただけます。", "新しい架空の作品のためのホスティング、ツール、時間に役立てます。", "完全に任意です。すべて無料のままです。", "購入ではなくチップです。商品・サービス・アクセス権・影響力はありません。", "続ける前に", "これらのサイトの内容はすべて架空です。応援するには、そのことを理解し、見返りがないことを確認していただく必要があります。", "確認へ進む →", "ご確認ください", "規約を読み、2
